Source.Name="OTR Video Switcher"

Properties.Instructions="Assign up to three videos here. Changes apply immediately, so the Test / Play buttons work before you close this window. Add this same source (Add Existing) to every horizontal and Aitum Vertical scene that needs it."
Properties.StreamDeckInstructions="Stream Deck shortcuts are ready: Ctrl+Alt+1 = Video 1, Ctrl+Alt+2 = Video 2, Ctrl+Alt+3 = Video 3, Ctrl+Alt+0 = Stop. Program each deck key as a Keyboard Hotkey using the matching shortcut."
Properties.AudioInstructions="The selected video's audio and whoosh2 are one OTR Video Switcher mixer channel. Use OBS Advanced Audio Properties to select Monitor Off, Monitor Only, or Monitor and Output. OBS volume, mute, tracks, and monitoring now control this mix."
